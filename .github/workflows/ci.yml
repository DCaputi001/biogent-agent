# CI for the standalone biogent-agent repo.
#
# Modeled on the main BioGent repo's .github/workflows/ci.yml, minus everything
# that touches a cloud. No path filters: the whole repo is one service, so
# every job is relevant to every change.
#
# WHAT IS DELIBERATELY ABSENT: any deploy job, any ECR push, any Terraform, any
# cloud credentials. This repo loads researcher-uploaded .rds files, and R
# deserialization is a known RCE path (CVE-2024-27322) -- credentials that can
# reach production have no business in the same repository. Deployment is the
# main repo's job, after the import. tests/test_repo_invariants.py fails the
# build if any of it creeps back in.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  secret-scan:
    # Runs on every push whatever the change: a credential committed and then
    # deleted is still in history, so this is not a job worth making
    # conditional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret added and later removed is still caught.
          fetch-depth: 0

      # gitleaks-action@v2 is deliberately not used. On a push it scans only
      # <baseRef>^..<headRef>, which fatals when that range starts at a
      # parentless commit, and which is not the full history that fetch-depth: 0
      # above exists to provide. Running the binary directly is both fixes at
      # once. Pinned and checksum-verified: a moved tag must not be able to
      # change what runs in CI.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the full history for committed secrets
        # No --log-opts: every commit reachable from HEAD. --exit-code 1 means
        # findings, and only findings, fail the job. --redact keeps a matched
        # value out of a public build log.
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1 -v

  plan-file-not-committed:
    # BIOGENT_PLAN.md is local-only. .gitignore is the mechanism; this is the
    # check that the mechanism held, including against a `git add -f`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the build plan was never committed
        run: |
          if git log --all --name-only --format=format: -- BIOGENT_PLAN.md | grep -q .; then
            echo "BIOGENT_PLAN.md appears in this repo's history."
            echo "It is local-only and must never be committed."
            exit 1
          fi
          echo "BIOGENT_PLAN.md is absent from history, as intended."

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Run tests (no API key required)
        env:
          # The same guard the main repo uses: make sure nothing in the unit
          # suite quietly reaches a real model. It matters more here -- this
          # service orchestrates many model calls, and the researcher pays for
          # every one of them.
          ANTHROPIC_API_KEY: ""
        run: uv run pytest -q

  images:
    # Phase 7.1's checkpoint, as a check rather than a claim: every component
    # image builds, and the whole stack comes up healthy.
    #
    # Build only. Nothing is pushed, there is no registry, and there is
    # nothing to authenticate against -- images are built where they run until
    # deployment becomes the main repo's problem after the import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build every component image
        # `compose build` rather than four `docker build` calls: the build
        # contexts and Dockerfile paths are already declared in the compose
        # file, and two copies of them would drift.
        run: docker compose build

      - name: Generate the test fixtures
        # Synthetic datasets, written by the component images into data/.
        # They are not committed: .gitignore bans *.h5ad and *.rds outright,
        # which is what keeps a researcher's dataset out of git, and an
        # exception for tests/ would be a hole in exactly the wrong place.
        run: sh scripts/generate-fixtures.sh

      - name: Start the stack and wait for every healthcheck
        # --wait fails the step unless every service reports healthy, which is
        # what makes "docker compose up starts every container" a real check.
        run: docker compose up --detach --wait --wait-timeout 300

      - name: Runtime isolation and ingestion tests
        env:
          # Without this the suite skips when the stack is down, which is
          # right on a laptop and wrong here: a security test that skips in CI
          # reports green while checking nothing.
          BIOGENT_REQUIRE_DOCKER_STACK: "1"
          ANTHROPIC_API_KEY: ""
        run: uv run pytest -q -m docker

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
